name: Build APK

on:
  push:
    branches: [main, android-app]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 8.9 satisfies AGP 8.5.2 (needs >= 8.7); no gradle wrapper is checked into this repo.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Installs cmdline-tools, platform 34 and matching build-tools; sets ANDROID_HOME/ANDROID_SDK_ROOT.
      - name: Install Android SDK components
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSLo /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          python3 -m zipfile -e /tmp/clt.zip "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Assemble debug APK
        id: build
        continue-on-error: true
        run: gradle --no-daemon assembleDebug

      # Job logs need admin rights to read via API; this makes the real error visible in the public log.
      - name: Print build errors (diagnostics)
        if: failure() && steps.build.outcome == 'failure'
        run: |
          echo "=== last 200 lines of Gradle output ==="
          tail -n 200 "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          gradle --no-daemon assembleDebug --stacktrace 2>&1 | tail -n 250
          exit ${{ steps.build.outputs.conclusion == 'success' && 0 || 1 }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
