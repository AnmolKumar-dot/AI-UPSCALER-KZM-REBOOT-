name: Build APK

on:
  push:
    branches: [main, android-app]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Provides $ANDROID_HOME (cmdline-tools + platform 34 + build-tools) without any manual setup.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Gradle 8.9 satisfies AGP 8.5.2 (needs >= 8.7); no gradle wrapper is checked into this repo.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
